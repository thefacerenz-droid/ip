<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your IP</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0b0f;
            color: white;
            font-family: Arial, sans-serif;
        }

        .card {
            padding: 45px;
            text-align: center;
            background: #15151c;
            border-radius: 18px;
        }

        #ip {
            margin-top: 20px;
            font-size: 30px;
            color: #00ff88;
            font-weight: bold;
        }

        #error {
            margin-top: 15px;
            color: #ff5555;
        }
    </style>
</head>

<body>

<div class="card">
    <h1>Your IP Address</h1>

    <div id="ip">Loading...</div>
    <div id="error"></div>
</div>

<script>
fetch("/api/ip")
    .then(async response => {
        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || data.discord_error || "API error");
        }

        document.getElementById("ip").textContent = data.ip;
    })
    .catch(error => {
        document.getElementById("ip").textContent = "Failed";
        document.getElementById("error").textContent = error.message;
    });
</script>

</body>
</html>
