<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your IP Address</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #0b0b0f;
            color: white;

            font-family: Arial, Helvetica, sans-serif;
        }

        .card {
            width: 90%;
            max-width: 550px;

            padding: 50px 30px;

            text-align: center;

            background: #15151c;

            border: 1px solid #292934;
            border-radius: 20px;

            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        h1 {
            margin: 0 0 10px;

            font-size: 34px;
        }

        p {
            margin: 0 0 30px;

            color: #888;
            font-size: 16px;
        }

        #ip {
            font-size: 32px;
            font-weight: bold;

            color: #00ff88;

            word-break: break-all;
        }

        #error {
            margin-top: 20px;

            color: #ff5555;
            font-size: 14px;

            word-break: break-word;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Your IP Address</h1>

        <p>Your public IP address is:</p>

        <div id="ip">
            Loading...
        </div>

        <div id="error"></div>

    </div>

    <script>
        async function getIP() {

            try {

                const response = await fetch("/api/ip", {
                    method: "GET",
                    cache: "no-store"
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.error ||
                        data.details ||
                        "API request failed"
                    );
                }

                document.getElementById("ip").textContent = data.ip;

            } catch (error) {

                console.error(error);

                document.getElementById("ip").textContent = "Error";

                document.getElementById("error").textContent =
                    error.message;
            }
        }

        getIP();
    </script>

</body>
</html>
